<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kitten Blast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        html { scroll-padding-top: env(safe-area-inset-top, 0px); }
        html, body { height: 100% !important; }

        body {
            font-family: 'Fredoka', sans-serif;
            touch-action: none;
            overflow: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* Soft Pink Theme */
        body[data-theme="soft-pink"] {
            background: radial-gradient(circle at center, #fff1f2 0%, #ffe4e6 50%, #fbcfe8 100%);
            color: #831843;
        }
        body[data-theme="soft-pink"] .game-grid {
            background-color: rgba(255, 255, 255, 0.65);
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(244, 114, 182, 0.25);
        }
        body[data-theme="soft-pink"] .grid-cell {
            background-color: rgba(255, 255, 255, 0.85);
        }

        /* Cyber Dark Theme */
        body[data-theme="cyber-dark"] {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            color: #f1f5f9;
        }
        body[data-theme="cyber-dark"] .game-grid {
            background-color: rgba(30, 41, 59, 0.8);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.3), 0 0 15px rgba(168, 85, 247, 0.2);
        }
        body[data-theme="cyber-dark"] .grid-cell {
            background-color: rgba(15, 23, 42, 0.9);
        }

        /* Fresh Mint Theme */
        body[data-theme="fresh-mint"] {
            background: radial-gradient(circle at center, #f0fdf4 0%, #dcfce7 50%, #a7f3d0 100%);
            color: #064e3b;
        }
        body[data-theme="fresh-mint"] .game-grid {
            background-color: rgba(255, 255, 255, 0.65);
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.22);
        }
        body[data-theme="fresh-mint"] .grid-cell {
            background-color: rgba(255, 255, 255, 0.85);
        }

        /* Sunset Gold Theme */
        body[data-theme="sunset-gold"] {
            background: radial-gradient(circle at center, #fff7ed 0%, #ffedd5 50%, #fed7aa 100%);
            color: #7c2d12;
        }
        body[data-theme="sunset-gold"] .game-grid {
            background-color: rgba(255, 255, 255, 0.65);
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(249, 115, 22, 0.22);
        }
        body[data-theme="sunset-gold"] .grid-cell {
            background-color: rgba(255, 255, 255, 0.85);
        }

        body[data-theme="cyber-dark"] .deco-cat {
            opacity: 0.25;
            border-color: rgba(99, 102, 241, 0.5);
        }
        @keyframes catFloat {
            0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-8px) rotate(var(--rot, 0deg)); }
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 20px;
            border: 3px solid;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .grid-cell {
            border-radius: 8px;
            transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        }

        /* Grid Preview Highlights */
        .grid-cell.preview-valid {
            opacity: 0.75 !important;
            transform: scale(0.95);
            box-shadow: inset 0 0 8px rgba(255,255,255,0.8), 0 0 12px rgba(255,255,255,0.6) !important;
        }

        .shape-container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 135px;
            margin-top: 18px;
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            padding: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        body[data-theme="cyber-dark"] .shape-container {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .shape-wrapper {
            position: relative;
            cursor: grab;
            display: grid;
            gap: 2px;
            touch-action: none;
            transition: transform 0.2s ease;
        }

        .shape-wrapper:hover {
            transform: scale(1.06);
        }

        .shape-wrapper:active {
            cursor: grabbing;
        }

        .shape-cell {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -2px 4px rgba(0,0,0,0.18);
        }

        /* Drag Ghost Element - Exact Pixel Grid Fit */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            display: grid;
            gap: 4px;
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.25));
            will-change: left, top;
        }

        .ghost-cell {
            border-radius: 8px;
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.4), inset 0 -3px 6px rgba(0,0,0,0.2);
        }

        @keyframes clearPulse {
            0% { transform: scale(1); opacity: 1; filter: brightness(1); }
            50% { transform: scale(1.25); opacity: 0.85; filter: brightness(1.6); }
            100% { transform: scale(0); opacity: 0; filter: brightness(1); }
        }

        .clearing {
            animation: clearPulse 0.35s forwards ease-in-out;
            z-index: 15;
            box-shadow: 0 0 20px #f472b6 !important;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .pop-in {
            animation: popIn 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes comboFloat {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.25); opacity: 1; }
            70% { transform: translateY(-40px) scale(1.1); opacity: 1; }
            100% { transform: translateY(-70px) scale(0.8); opacity: 0; }
        }

        .floating-combo {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            font-weight: 900;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            animation: comboFloat 1.2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

            </button>

            <div class="w-12 h-12 bg-rose-100 dark:bg-slate-800 rounded-2xl flex items-center justify-center mb-2 text-2xl border-2 border-rose-200 dark:border-slate-700">
                ⚙️
            </div>
            
            <h2 class="text-2xl font-black mb-4">Seçenekler</h2>
            
            <div class="w-full bg-rose-50/80 dark:bg-slate-800/80 p-3.5 rounded-2xl mb-4 border border-rose-100 dark:border-slate-700 flex flex-col gap-2">
                <p class="text-xs font-bold opacity-80 text-left">🎨 Renk Teması</p>
                <div class="grid grid-cols-2 gap-2">
                    <button data-set-theme="soft-pink" class="theme-select-btn px-3 py-2 rounded-xl text-xs font-bold border-2 transition cursor-pointer bg-pink-100 text-pink-800 border-pink-300">🌸 Pembe</button>
                    <button data-set-theme="cyber-dark" class="theme-select-btn px-3 py-2 rounded-xl text-xs font-bold border-2 transition cursor-pointer bg-slate-800 text-indigo-300 border-indigo-500">🌙 Dark Neon</button>
                    <button data-set-theme="fresh-mint" class="theme-select-btn px-3 py-2 rounded-xl text-xs font-bold border-2 transition cursor-pointer bg-emerald-100 text-emerald-800 border-emerald-300">🌿 Mint</button>
                    <button data-set-theme="sunset-gold" class="theme-select-btn px-3 py-2 rounded-xl text-xs font-bold border-2 transition cursor-pointer bg-amber-100 text-amber-800 border-amber-300">🌅 Sunset</button>
                </div>
            </div>

            <div class="w-full bg-rose-50/80 dark:bg-slate-800/80 p-3.5 rounded-2xl mb-5 border border-rose-100 dark:border-slate-700 flex flex-col gap-2">
                <div class="flex justify-between items-center text-xs font-bold">
                    <span class="flex items-center gap-1.5"><span id="sound-icon">🔊</span> Ses Seviyesi</span>
                    <span id="volume-value-text" class="bg-rose-200 dark:bg-slate-700 px-2 py-0.5 rounded-full font-black">100%</span>
                </div>
                <div class="flex items-center gap-3">
                    <input type="range" id="volume-slider" min="0" max="100" value="100" class="w-full accent-rose-500 h-2 bg-rose-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    <button id="mute-btn" class="px-3 py-1 bg-rose-200 dark:bg-slate-700 text-xs font-bold rounded-xl transition active:scale-95 whitespace-nowrap cursor-pointer">Sessiz</button>
                </div>
            </div>

            <div class="w-full flex flex-col gap-2">
                <button id="resume-btn" class="w-full py-3 bg-gradient-to-r from-rose-500 to-indigo-600 hover:from-rose-600 hover:to-indigo-700 text-white font-bold rounded-2xl shadow transition text-sm cursor-pointer">▶️️ Oyuna Devam Et</button>
                <button id="restart-option-btn" class="w-full py-3 bg-rose-100 dark:bg-slate-800 text-rose-600 dark:text-rose-400 font-bold rounded-2xl border border-rose-200 dark:border-slate-700 transition text-sm cursor-pointer">🔄 Yeniden Başlat</button>
                <button id="main-menu-btn" class="w-full py-3 bg-rose-50 dark:bg-slate-800/50 font-bold rounded-2xl border border-rose-200 dark:border-slate-700 transition text-sm cursor-pointer">🏠 Ana Menü</button>
            </div>
        </div>
    </div>

    <script>
        // Yayınlanmış sayfada tarayıcı depolaması kapalı olabilir; hata vermeden devam et
        const store = {
            get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
            set(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
        };

        const BOARD_SIZE = 8;
        let board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
        let score = 0;
        let highScore = store.get('blockBlastHighScore') || 0;
        let streakCount = 0;
        let currentTheme = store.get('blockBlastTheme') || 'soft-pink';
        let currentShapes = [];

        const gridElement = document.getElementById('game-grid');
        const trayElement = document.getElementById('shape-tray');
        const scoreElement = document.getElementById('score-display');
        const highScoreElement = document.getElementById('high-score-display');
        const gameOverOverlay = document.getElementById('game-over');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreElement = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const comboContainer = document.getElementById('combo-container');

        const menuBtn = document.getElementById('menu-btn');
        const optionsModal = document.getElementById('options-modal');
        const optionsContent = document.getElementById('options-content');
        const closeOptionsBtn = document.getElementById('close-options-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeValueText = document.getElementById('volume-value-text');
        const soundIcon = document.getElementById('sound-icon');
        const muteBtn = document.getElementById('mute-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const restartOptionBtn = document.getElementById('restart-option-btn');
        const mainMenuBtn = document.getElementById('main-menu-btn');

        let audioCtx = null;
        let soundVolume = parseFloat(store.get('blockBlastVolume') ?? '1');
        let isMuted = soundVolume === 0;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type, comboMultiplier = 1) {
            if (soundVolume <= 0 || isMuted) return;
            try {
                const ctx = getAudioContext();
                const masterGain = ctx.createGain();
                masterGain.gain.setValueAtTime(soundVolume * 0.35, ctx.currentTime);
                masterGain.connect(ctx.destination);

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(masterGain);

                const now = ctx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(750, now + 0.05);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'place') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(340, now);
                    osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
                    gain.gain.setValueAtTime(0.7, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'clear') {
                    const baseFreq = 523.25 * (1 + (comboMultiplier - 1) * 0.15);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(baseFreq, now);
                    osc.frequency.setValueAtTime(baseFreq * 1.25, now + 0.06);
                    osc.frequency.setValueAtTime(baseFreq * 1.5, now + 0.12);
                    osc.frequency.setValueAtTime(baseFreq * 2.0, now + 0.18);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.4);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch(e) {}
        }

        function setTheme(themeName) {
            currentTheme = themeName;
            document.body.setAttribute('data-theme', themeName);
            store.set('blockBlastTheme', themeName);
            
            document.querySelectorAll('.theme-select-btn').forEach(btn => {
                if (btn.getAttribute('data-set-theme') === themeName) {
                    btn.classList.add('ring-2', 'ring-rose-500', 'scale-105');
                } else {
                    btn.classList.remove('ring-2', 'ring-rose-500', 'scale-105');
                }
            });
            renderBoard();
        }

        document.querySelectorAll('.theme-select-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                playSound('click');
                setTheme(btn.getAttribute('data-set-theme'));
            });
        });

        function updateVolumeUI() {
            const pct = Math.round(soundVolume * 100);
            volumeSlider.value = pct;
            volumeValueText.innerText = `${pct}%`;
            if (pct === 0) {
                soundIcon.innerText = '🔇';
                muteBtn.innerText = 'Aç';
            } else if (pct < 50) {
                soundIcon.innerText = '🔉';
                muteBtn.innerText = 'Sessiz';
            } else {
                soundIcon.innerText = '🔊';
                muteBtn.innerText = 'Sessiz';
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            soundVolume = parseInt(e.target.value) / 100;
            isMuted = soundVolume === 0;
            store.set('blockBlastVolume', soundVolume);
            updateVolumeUI();
        });

        muteBtn.addEventListener('click', () => {
            playSound('click');
            if (soundVolume > 0) {
                soundVolume = 0;
                isMuted = true;
            } else {
                soundVolume = 1;
                isMuted = false;
            }
            store.set('blockBlastVolume', soundVolume);
            updateVolumeUI();
        });

        function openOptions() {
            playSound('click');
            optionsModal.classList.remove('hidden');
            setTimeout(() => {
                optionsModal.classList.remove('opacity-0');
                optionsModal.classList.add('opacity-100');
                optionsContent.classList.remove('scale-95');
                optionsContent.classList.add('scale-100');
            }, 10);
        }

        function closeOptions() {
            playSound('click');
            optionsModal.classList.remove('opacity-100');
            optionsModal.classList.add('opacity-0');
            optionsContent.classList.remove('scale-100');
            optionsContent.classList.add('scale-95');
            setTimeout(() => {
                optionsModal.classList.add('hidden');
            }, 300);
        }

        menuBtn.addEventListener('click', openOptions);
        closeOptionsBtn.addEventListener('click', closeOptions);
        resumeBtn.addEventListener('click', closeOptions);

        restartOptionBtn.addEventListener('click', () => {
            playSound('click');
            closeOptions();
            restartGame();
        });

        mainMenuBtn.addEventListener('click', () => {
            playSound('click');
            closeOptions();
            restartGame();
            startScreen.style.display = 'flex';
            setTimeout(() => {
                startScreen.classList.remove('opacity-0', 'pointer-events-none');
            }, 10);
        });

        if (startBtn) {
            startBtn.addEventListener('click', () => {
                const typed = nameInput.value.trim().slice(0, 14);
                if (!typed) {
                    nameInput.focus();
                    nameInput.style.borderColor = '#f43f5e';
                    return;
                }
                playerName = typed;
                store.set('kittenName', playerName);
                playSound('click');
                startScreen.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    startScreen.style.display = 'none';
                }, 500);
            });
        }

        const themeColorPalettes = {
            'soft-pink': ['#fb6f92', '#ff8fa3', '#ff4d6d', '#f97316', '#fb923c', '#ff758f', '#e11d48'],
            'cyber-dark': ['#06b6d4', '#f43f5e', '#a855f7', '#10b981', '#eab308', '#3b82f6', '#ec4899'],
            'fresh-mint': ['#0d9488', '#059669', '#0284c7', '#14b8a6', '#34d399', '#06b6d4', '#10b981'],
            'sunset-gold': ['#f97316', '#ea580c', '#d97706', '#eab308', '#ef4444', '#f43f5e', '#fb923c']
        };

        const shapeDefinitions = [
            { matrix: [[1]], name: 'dot' },
            { matrix: [[1,1]], name: 'h2' },
            { matrix: [[1,1,1]], name: 'h3' },
            { matrix: [[1,1,1,1]], name: 'h4' },
            { matrix: [[1,1,1,1,1]], name: 'h5' },
            { matrix: [[1],[1]], name: 'v2' },
            { matrix: [[1],[1],[1]], name: 'v3' },
            { matrix: [[1],[1],[1],[1]], name: 'v4' },
            { matrix: [[1],[1],[1],[1],[1]], name: 'v5' },
            { matrix: [[1,1],[1,1]], name: 'sq2' },
            { matrix: [[1,1,1],[1,1,1],[1,1,1]], name: 'sq3' },
            { matrix: [[1,1],[1,0]], name: 'l-small-1' },
            { matrix: [[1,1],[0,1]], name: 'l-small-2' },
            { matrix: [[0,1],[1,1]], name: 'l-small-3' },
            { matrix: [[1,0],[1,1]], name: 'l-small-4' },
            { matrix: [[1,0,0],[1,1,1]], name: 'l-large-1' },
            { matrix: [[0,0,1],[1,1,1]], name: 'l-large-2' },
            { matrix: [[1,1,1],[1,0,0]], name: 'l-large-3' },
            { matrix: [[1,1,1],[0,0,1]], name: 'l-large-4' },
            { matrix: [[1,1,1],[0,1,0]], name: 't-up' },
            { matrix: [[0,1,0],[1,1,1]], name: 't-down' },
            { matrix: [[1,0],[1,1],[1,0]], name: 't-right' },
            { matrix: [[0,1],[1,1],[0,1]], name: 't-left' }
        ];

        function initBoard() {
            gridElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('grid-cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    gridElement.appendChild(cell);
                }
            }
        }

        function renderBoard() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.querySelector(`.grid-cell[data-row="${r}"][data-col="${c}"]`);
                    if (!cell) continue;
                    if (board[r][c]) {
                        cell.style.backgroundColor = board[r][c];
                        cell.style.boxShadow = 'inset 0 3px 6px rgba(255,255,255,0.4), inset 0 -3px 6px rgba(0,0,0,0.2)';
                        cell.style.border = '1px solid rgba(255,255,255,0.2)';
                    } else {
                        cell.style.backgroundColor = '';
                        cell.style.boxShadow = 'none';
                        cell.style.border = 'none';
                    }
                }
            }
        }

        function getRandomShape() {
            const def = shapeDefinitions[Math.floor(Math.random() * shapeDefinitions.length)];
            const palette = themeColorPalettes[currentTheme] || themeColorPalettes['soft-pink'];
            const color = palette[Math.floor(Math.random() * palette.length)];
            return { matrix: def.matrix, color: color };
        }

        function refillTray() {
            currentShapes = [getRandomShape(), getRandomShape(), getRandomShape()];
            renderTray(true);
            checkGameOver();
        }

        function renderTray(isRefill = false) {
            trayElement.innerHTML = '';
            currentShapes.forEach((shape, index) => {
                if (!shape) {
                    const placeholder = document.createElement('div');
                    placeholder.style.width = '60px';
                    trayElement.appendChild(placeholder);
                    return;
                }

                const wrapper = document.createElement('div');
                wrapper.classList.add('shape-wrapper');
                if (isRefill) {
                    wrapper.classList.add('pop-in');
                    wrapper.style.animationDelay = `${index * 0.1}s`;
                }
                wrapper.dataset.index = index;

                const rows = shape.matrix.length;
                const cols = shape.matrix[0].length;
                wrapper.style.gridTemplateColumns = `repeat(${cols}, 24px)`;
                wrapper.style.gridTemplateRows = `repeat(${rows}, 24px)`;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const cell = document.createElement('div');
                        if (shape.matrix[r][c]) {
                            cell.classList.add('shape-cell');
                            cell.style.backgroundColor = shape.color;
                        } else {
                            cell.style.backgroundColor = 'transparent';
                            cell.style.boxShadow = 'none';
                        }
                        wrapper.appendChild(cell);
                    }
                }

                addDragListeners(wrapper, shape, index);
                trayElement.appendChild(wrapper);
            });
        }

        let draggedShape = null;
        let ghostEl = null;
        let currentPointerType = 'mouse';

        function getGridCellDimensions() {
            const firstCell = gridElement.querySelector('.grid-cell[data-row="0"][data-col="0"]');
            const secondCell = gridElement.querySelector('.grid-cell[data-row="0"][data-col="1"]');
            if (!firstCell) return { cellW: 38, cellH: 38, gap: 4 };

            const rect1 = firstCell.getBoundingClientRect();
            const rect2 = secondCell ? secondCell.getBoundingClientRect() : null;
            const gap = rect2 ? (rect2.left - rect1.right) : 4;

            return {
                cellW: rect1.width,
                cellH: rect1.height,
                gap: gap
            };
        }

        function addDragListeners(element, shape, index) {
            element.addEventListener('pointerdown', (e) => {
                if (e.button !== 0 && e.type === 'mousedown') return;
                e.preventDefault();

                currentPointerType = e.pointerType;

                if (draggedShape) cancelDrag();

                draggedShape = { element, shape, index };
                
                const { cellW, cellH, gap } = getGridCellDimensions();
                const cols = shape.matrix[0].length;
                const rows = shape.matrix.length;

                ghostEl = document.createElement('div');
                ghostEl.classList.add('drag-ghost');
                ghostEl.style.gridTemplateColumns = `repeat(${cols}, ${cellW}px)`;
                ghostEl.style.gridTemplateRows = `repeat(${rows}, ${cellH}px)`;
                ghostEl.style.gap = `${gap}px`;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const cell = document.createElement('div');
                        if (shape.matrix[r][c]) {
                            cell.classList.add('ghost-cell');
                            cell.style.width = `${cellW}px`;
                            cell.style.height = `${cellH}px`;
                            cell.style.backgroundColor = shape.color;
                        } else {
                            cell.style.backgroundColor = 'transparent';
                        }
                        ghostEl.appendChild(cell);
                    }
                }

                document.body.appendChild(ghostEl);
                element.style.opacity = '0';

                moveGhostAndPreview(e);

                document.addEventListener('pointermove', onDragMove, { passive: false });
                document.addEventListener('pointerup', onDragEnd);
                document.addEventListener('pointercancel', cancelDrag);
            });
        }

        function calculateGridCoordinates(e) {
            if (!draggedShape) return null;

            const { cellW, cellH, gap } = getGridCellDimensions();
            const cols = draggedShape.shape.matrix[0].length;
            const rows = draggedShape.shape.matrix.length;

            const shapeW = cols * cellW + (cols - 1) * gap;
            const shapeH = rows * cellH + (rows - 1) * gap;

            const isTouch = (currentPointerType === 'touch' || currentPointerType === 'pen');
            const touchOffsetY = isTouch ? -70 : 0; // Offset finger so shape is visible

            const ghostLeft = e.clientX - (shapeW / 2);
            const ghostTop = e.clientY - (shapeH / 2) + touchOffsetY;

            const firstCell = gridElement.querySelector('.grid-cell[data-row="0"][data-col="0"]');
            if (!firstCell) return null;

            const boardOrigin = firstCell.getBoundingClientRect();
            const stepX = cellW + gap;
            const stepY = cellH + gap;

            const col = Math.round((ghostLeft - boardOrigin.left) / stepX);
            const row = Math.round((ghostTop - boardOrigin.top) / stepY);

            return { row, col, ghostLeft, ghostTop };
        }

        function moveGhostAndPreview(e) {
            const coords = calculateGridCoordinates(e);
            if (!coords || !ghostEl) return;

            ghostEl.style.left = `${coords.ghostLeft}px`;
            ghostEl.style.top = `${coords.ghostTop}px`;

            clearGridPreview();

            if (canPlace(draggedShape.shape.matrix, coords.row, coords.col)) {
                highlightPreview(draggedShape.shape, coords.row, coords.col);
            }
        }

        function onDragMove(e) {
            e.preventDefault();
            moveGhostAndPreview(e);
        }

        function clearGridPreview() {
            document.querySelectorAll('.grid-cell.preview-valid').forEach(cell => {
                cell.classList.remove('preview-valid');
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if (board[r][c]) {
                    cell.style.backgroundColor = board[r][c];
                } else {
                    cell.style.backgroundColor = '';
                }
            });
        }

        function highlightPreview(shape, startRow, startCol) {
            const matrix = shape.matrix;
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[0].length; c++) {
                    if (matrix[r][c] === 1) {
                        const boardRow = startRow + r;
                        const boardCol = startCol + c;
                        const cell = document.querySelector(`.grid-cell[data-row="${boardRow}"][data-col="${boardCol}"]`);
                        if (cell) {
                            cell.classList.add('preview-valid');
                            cell.style.backgroundColor = shape.color;
                        }
                    }
                }
            }
        }

        function cancelDrag() {
            document.removeEventListener('pointermove', onDragMove);
            document.removeEventListener('pointerup', onDragEnd);
            document.removeEventListener('pointercancel', cancelDrag);

            clearGridPreview();

            if (ghostEl) {
                ghostEl.remove();
                ghostEl = null;
            }

            if (draggedShape && draggedShape.element) {
                draggedShape.element.style.opacity = '';
                draggedShape = null;
            }
        }

        function onDragEnd(e) {
            if (!draggedShape) {
                cancelDrag();
                return;
            }

            const coords = calculateGridCoordinates(e);
            let placed = false;

            if (coords) {
                if (canPlace(draggedShape.shape.matrix, coords.row, coords.col)) {
                    placeShape(draggedShape.shape, coords.row, coords.col);
                    placed = true;
                }
            }

            if (placed) {
                const shapeIdx = draggedShape.index;
                cancelDrag();
                currentShapes[shapeIdx] = null;
                renderTray();
                processTurn();
            } else {
                cancelDrag();
            }
        }

        function canPlace(matrix, startRow, startCol) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[0].length; c++) {
                    if (matrix[r][c] === 1) {
                        const boardRow = startRow + r;
                        const boardCol = startCol + c;
                        if (boardRow < 0 || boardRow >= BOARD_SIZE || boardCol < 0 || boardCol >= BOARD_SIZE) return false;
                        if (board[boardRow][boardCol] !== null) return false;
                    }
                }
            }
            return true;
        }

        function placeShape(shape, startRow, startCol) {
            let blocksPlaced = 0;
            for (let r = 0; r < shape.matrix.length; r++) {
                for (let c = 0; c < shape.matrix[0].length; c++) {
                    if (shape.matrix[r][c] === 1) {
                        board[startRow + r][startCol + c] = shape.color;
                        blocksPlaced++;
                    }
                }
            }
            score += blocksPlaced;
            playSound('place');
            updateScore();
            renderBoard();
        }

        async function processTurn() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (board[r].every(cell => cell !== null)) rowsToClear.push(r);
            }

            for (let c = 0; c < BOARD_SIZE; c++) {
                let isFull = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (board[r][c] === null) { isFull = false; break; }
                }
                if (isFull) colsToClear.push(c);
            }

            const totalLines = rowsToClear.length + colsToClear.length;

            if (totalLines > 0) {
                streakCount++;
                let points = totalLines * 10;
                
                if (totalLines > 1) {
                    points += (totalLines * 15);
                    triggerComboBanner(`COMBO x${totalLines}! 🔥`, '#f97316');
                }
                if (streakCount > 1) {
                    points *= (1 + streakCount * 0.2);
                    setTimeout(() => triggerComboBanner(`STREAK x${streakCount} ⚡`, '#3b82f6'), 200);
                }

                score += Math.round(points);
                playSound('clear', Math.max(totalLines, streakCount));
                updateScore();

                let cellsToClear = new Set();
                rowsToClear.forEach(r => {
                    for(let c = 0; c < BOARD_SIZE; c++) cellsToClear.add(`${r},${c}`);
                });
                colsToClear.forEach(c => {
                    for(let r = 0; r < BOARD_SIZE; r++) cellsToClear.add(`${r},${c}`);
                });

                cellsToClear.forEach(coord => {
                    const [r, c] = coord.split(',');
                    const cellEl = document.querySelector(`.grid-cell[data-row="${r}"][data-col="${c}"]`);
                    if (cellEl) cellEl.classList.add('clearing');
                });

                await new Promise(resolve => setTimeout(resolve, 350));

                cellsToClear.forEach(coord => {
                    const [r, c] = coord.split(',');
                    board[r][c] = null;
                    const cellEl = document.querySelector(`.grid-cell[data-row="${r}"][data-col="${c}"]`);
                    if (cellEl) cellEl.classList.remove('clearing');
                });
                renderBoard();
            } else {
                streakCount = 0;
            }

            if (currentShapes.every(s => s === null)) {
                refillTray();
            } else {
                checkGameOver();
            }
        }

        function triggerComboBanner(text, textColor) {
            const banner = document.createElement('div');
            banner.className = 'floating-combo text-3xl sm:text-4xl';
            banner.style.color = textColor;
            banner.innerText = text;
            comboContainer.appendChild(banner);
            setTimeout(() => banner.remove(), 1200);
        }

        function updateScore() {
            scoreElement.innerText = score;
            scoreElement.style.transform = 'scale(1.25)';
            if (score > highScore) {
                highScore = score;
                store.set('blockBlastHighScore', highScore);
                if (highScoreElement) highScoreElement.innerText = highScore;
            }
            setTimeout(() => {
                scoreElement.style.transform = 'scale(1)';
                scoreElement.style.transition = 'transform 0.2s ease';
            }, 150);
        }

        function checkGameOver() {
            let possibleMoveExists = false;
            for (let shape of currentShapes) {
                if (!shape) continue;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (canPlace(shape.matrix, r, c)) {
                            possibleMoveExists = true;
                            break;
                        }
                    }
                    if (possibleMoveExists) break;
                }
                if (possibleMoveExists) break;
            }

            if (!possibleMoveExists) endGame();
        }

        function endGame() {
            submitScore(score);
            playSound('gameover');
            finalScoreElement.innerText = score;
            gameOverOverlay.classList.remove('hidden');
            setTimeout(() => {
                gameOverOverlay.classList.remove('opacity-0');
                gameOverOverlay.classList.add('opacity-100');
                gameOverModal.classList.remove('scale-95');
                gameOverModal.classList.add('scale-100');
            }, 10);
        }

        function restartGame() {
            submitScore(score);
            board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
            score = 0;
            streakCount = 0;
            updateScore();

            gameOverOverlay.classList.remove('opacity-100');
            gameOverOverlay.classList.add('opacity-0');
            gameOverModal.classList.remove('scale-100');
            gameOverModal.classList.add('scale-95');

            setTimeout(() => {
                gameOverOverlay.classList.add('hidden');
                renderBoard();
                refillTray();
            }, 400);
        }

        restartBtn.addEventListener('click', restartGame);

        // ---- Kullanıcı adı ve ortak skor tablosu ----
        const nameInput = document.getElementById('name-input');
        const lbFull = document.getElementById('lb-full');
        const lbOver = document.getElementById('lb-over');
        let playerName = store.get('kittenName') || '';
        let dbRef = null, myId = null, submitting = false;
        nameInput.value = playerName;
        nameInput.addEventListener('input', () => { nameInput.style.borderColor = '#fbcfe8'; });
        nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startBtn.click(); });

        const lbModal = document.getElementById('lb-modal');
        function openLeaderboard() {
            playSound('click');
            loadLeaderboard();
            lbModal.classList.remove('hidden');
            lbModal.classList.add('flex');
        }
        function closeLeaderboard() {
            playSound('click');
            lbModal.classList.add('hidden');
            lbModal.classList.remove('flex');
        }
        document.getElementById('lb-btn').addEventListener('click', openLeaderboard);
        document.getElementById('lb-close').addEventListener('click', closeLeaderboard);
        lbModal.addEventListener('click', (e) => { if (e.target === lbModal) closeLeaderboard(); });

        function renderLeaderboard(rows) {
            [[lbFull, 20], [lbOver, 5]].forEach(([box, limit]) => {
                box.innerHTML = '';
                if (rows === null) { box.textContent = 'Skor tablosu şu an kullanılamıyor'; return; }
                if (!rows.length) { box.textContent = 'Henüz skor yok, ilk sen ol! 🐾'; return; }
                rows.slice(0, limit).forEach((r, i) => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between px-3 py-1 rounded-xl' + (r.name === playerName ? ' bg-pink-200/70' : '');
                    const left = document.createElement('span');
                    left.textContent = (['🥇', '🥈', '🥉'][i] || (i + 1) + '.') + ' ' + r.name;
                    const right = document.createElement('span');
                    right.textContent = r.best;
                    row.append(left, right);
                    box.appendChild(row);
                });
            });
        }

        // ---- Supabase ayarları: kurulum dosyasındaki adımlardan sonra doldur ----
        const SUPABASE_URL = 'https://iecrnlboveuluhywodww.supabase.co';   // örn. https://abcdxyz.supabase.co
        const SUPABASE_KEY = 'sb_publishable_V5FHD7JKdokhDfCjyn_ovA__LX8kKH6';   // "anon public" anahtarı
        const ONLINE = !!(SUPABASE_URL && SUPABASE_KEY);

        function api(path, opts = {}) {
            return fetch(SUPABASE_URL.replace(/\/rest\/v1\/?$/, '').replace(/\/+$/, '') + '/rest/v1/' + path, {
                ...opts,
                headers: { apikey: SUPABASE_KEY, ...(SUPABASE_KEY.startsWith('eyJ') ? { Authorization: 'Bearer ' + SUPABASE_KEY } : {}), 'Content-Type': 'application/json', ...(opts.headers || {}) }
            });
        }

        function getPlayerId() {
            let id = store.get('kittenPid');
            if (!id) {
                id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
                    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
                store.set('kittenPid', id);
            }
            return id;
        }

        async function loadLeaderboard() {
            if (!ONLINE) { renderLeaderboard(null); return; }
            try {
                const res = await api('leaderboard?select=name,best&order=best.desc&limit=20');
                if (!res.ok) throw new Error('http');
                const data = await res.json();
                renderLeaderboard(data.map(r => ({ name: String(r.name || 'Kedi').slice(0, 14), best: Number(r.best) || 0 })));
            } catch (e) { renderLeaderboard(null); }
        }

        function initOnline() {
            if (!ONLINE) {
                // Ayar yapılmadıysa skor tablosu ve ad kutusu gizli kalır
                nameInput.value = nameInput.value || 'Oyuncu';
                [nameInput, document.getElementById('lb-btn'), document.getElementById('lb-wrap')].forEach(el => { if (el) el.style.display = 'none'; });
                return;
            }
            loadLeaderboard();
        }

        function setLbStatus(text) { const el = document.getElementById('lb-status'); if (el) el.textContent = text; }

        async function submitScore(finalScore) {
            if (!ONLINE || finalScore <= 0 || submitting || !playerName) return;
            submitting = true;
            try {
                const res = await api('rpc/submit_score', {
                    method: 'POST',
                    body: JSON.stringify({ p_id: getPlayerId(), p_name: playerName, p_best: finalScore })
                });
                if (!res.ok) throw new Error('http');
                setLbStatus('✅ Skorun tabloya kaydedildi');
                loadLeaderboard();
            } catch (e) { setLbStatus('⚠️ Skorun tabloya yazılamadı, bağlantını kontrol et'); }
            submitting = false;
        }

        window.onload = function() {
            if (highScoreElement) highScoreElement.innerText = highScore;
            setTheme(currentTheme);
            updateVolumeUI();
            initOnline();
            initBoard();
            renderBoard();
            refillTray();
        };
    </script>
</body>
</html>
